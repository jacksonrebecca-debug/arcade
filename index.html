<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BALLPARK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFF6E5; --ink:#1d1a16; --coral:#FF5B4A; --sun:#FFC42E;
    --teal:#1FB89B; --peri:#6C7CFF; --line:#1d1a16; --shadow:6px 6px 0 var(--line);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{background:var(--paper); color:var(--ink);
    font-family:'Nunito',system-ui,'Trebuchet MS',sans-serif;}
  body{min-height:100vh; padding:18px 16px 60px;
    background-image:radial-gradient(var(--line) 1.1px, transparent 1.1px);
    background-size:26px 26px; background-position:-13px -13px;}
  .wrap{max-width:680px; margin:0 auto}
  h1,h2,h3,.disp{font-family:'Fredoka',system-ui,sans-serif}
  header{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px}
  .logo{font-weight:700; font-size:34px; letter-spacing:-1px; line-height:.9}
  .logo small{display:block; font-size:12px; font-weight:600; letter-spacing:3px;
    color:var(--coral); text-transform:uppercase}
  .streak{background:var(--sun); border:3px solid var(--line); border-radius:14px;
    padding:8px 12px; box-shadow:var(--shadow); font-family:'Fredoka'; font-weight:600;
    text-align:center; min-width:96px}
  .streak b{display:block; font-size:24px; line-height:1}
  .streak span{font-size:10px; letter-spacing:1.5px; text-transform:uppercase}
  .card{background:#fff; border:3px solid var(--line); border-radius:22px;
    box-shadow:var(--shadow); padding:22px 20px; margin-bottom:18px}
  .modes{display:grid; grid-template-columns:1fr; gap:12px}
  @media(min-width:560px){.modes{grid-template-columns:1fr 1fr 1fr}}
  .mode{cursor:pointer; border:3px solid var(--line); border-radius:18px; padding:16px;
    box-shadow:var(--shadow); transition:transform .08s ease; text-align:left; background:#fff}
  .mode:hover{transform:translate(-2px,-2px); box-shadow:8px 8px 0 var(--line)}
  .mode:active{transform:translate(3px,3px); box-shadow:2px 2px 0 var(--line)}
  .mode .emoji{font-size:30px}
  .mode h3{font-size:19px; margin:6px 0 2px}
  .mode .age{display:inline-block; font-size:11px; font-weight:900; letter-spacing:1px;
    border-radius:20px; padding:2px 9px; margin-bottom:6px; text-transform:uppercase}
  .mode p{font-size:13px; line-height:1.35; opacity:.85}
  .m1 .age{background:var(--sun)} .m2 .age{background:var(--teal); color:#fff} .m3 .age{background:var(--peri); color:#fff}
  .lead{font-size:15px; line-height:1.5; margin:2px 0 16px}
  .lead .pill{font-family:'Fredoka'; font-weight:600; background:var(--sun); padding:1px 8px; border-radius:8px; border:2px solid var(--line)}
  .vs{display:flex; align-items:center; justify-content:center; gap:10px; margin:4px 0 14px; font-weight:900; font-size:14px}
  .toggle{cursor:pointer; width:62px; height:30px; border:3px solid var(--line); border-radius:30px; background:#f0ead8; position:relative; box-shadow:2px 2px 0 var(--line)}
  .toggle .knob{position:absolute; top:1px; left:1px; width:22px; height:22px; border-radius:50%; background:var(--coral); border:2px solid var(--line); transition:left .15s}
  .toggle.on{background:#BFece0} .toggle.on .knob{left:33px; background:var(--teal)}
  .q{font-family:'Fredoka'; font-weight:600; font-size:24px; line-height:1.15; margin-bottom:4px}
  .qsub{font-size:13px; opacity:.7; margin-bottom:18px}
  .who{font-family:'Fredoka'; font-weight:700; font-size:15px; padding:4px 10px; border-radius:10px; border:3px solid var(--line); display:inline-block; margin-bottom:12px}
  .who.p1{background:var(--peri); color:#fff} .who.p2{background:var(--coral); color:#fff}
  .opts{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .opt{cursor:pointer; font-family:'Fredoka'; font-weight:600; font-size:22px;
    border:3px solid var(--line); border-radius:16px; padding:18px 10px; background:#fff;
    box-shadow:var(--shadow); transition:transform .08s}
  .opt small{display:block; font-size:11px; font-weight:700; font-family:'Nunito'; opacity:.6; letter-spacing:1px}
  .opt:hover{transform:translate(-2px,-2px)} .opt:active{transform:translate(3px,3px); box-shadow:2px 2px 0 var(--line)}
  .opt.c1{background:#FFE9A8}.opt.c2{background:#BFece0}.opt.c3{background:#D7DcFF}.opt.c4{background:#FFD2CC}
  .srow{margin:14px 0}
  .srow label{display:flex; justify-content:space-between; align-items:baseline; font-weight:700; margin-bottom:6px}
  .srow label b{font-family:'Fredoka'; font-size:22px; color:var(--coral)}
  input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:14px;
    background:#f0ead8; border:3px solid var(--line); border-radius:20px; outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:30px; height:30px;
    background:var(--teal); border:3px solid var(--line); border-radius:50%; cursor:grab; box-shadow:2px 2px 0 var(--line)}
  input[type=range]::-moz-range-thumb{width:30px; height:30px; background:var(--teal);
    border:3px solid var(--line); border-radius:50%; cursor:grab}
  .lo input::-webkit-slider-thumb{background:var(--peri)} .hi input::-webkit-slider-thumb{background:var(--coral)}
  .lo input::-moz-range-thumb{background:var(--peri)} .hi input::-moz-range-thumb{background:var(--coral)}
  .band{height:26px; border:3px solid var(--line); border-radius:14px; background:#f0ead8;
    position:relative; margin:8px 0 4px; overflow:hidden}
  .band .fill{position:absolute; top:0; bottom:0; background:repeating-linear-gradient(45deg,var(--peri),var(--peri) 8px,#8a96ff 8px,#8a96ff 16px); transition:left .25s,right .25s}
  .scale{display:flex; justify-content:space-between; font-size:11px; opacity:.55; font-weight:700}
  .btn{cursor:pointer; font-family:'Fredoka'; font-weight:600; font-size:18px; color:#fff;
    background:var(--coral); border:3px solid var(--line); border-radius:16px; padding:13px 20px;
    box-shadow:var(--shadow); width:100%; margin-top:8px; transition:transform .08s}
  .btn:hover{transform:translate(-2px,-2px)} .btn:active{transform:translate(3px,3px); box-shadow:2px 2px 0 var(--line)}
  .btn.ghost{background:#fff; color:var(--ink)} .btn.teal{background:var(--teal)} .btn.peri{background:var(--peri)}
  .reveal{text-align:center; padding:8px 0}
  .verdict{font-family:'Fredoka'; font-weight:700; font-size:26px; margin-bottom:6px}
  .bignum{font-family:'Fredoka'; font-weight:700; font-size:46px; line-height:1; color:var(--coral); letter-spacing:-1px; word-break:break-all}
  .bignum.win{color:var(--teal)}
  .friendly{font-size:15px; opacity:.7; margin-top:2px}
  .explain{background:#FFF6E5; border:3px solid var(--line); border-radius:14px; padding:12px 14px;
    text-align:left; font-size:14px; line-height:1.45; margin:16px 0 4px}
  .explain b{font-family:'Fredoka'}
  .chainviz{font-family:'Fredoka'; font-weight:600; font-size:18px; margin:6px 0; word-spacing:2px}
  .chainviz .x{color:var(--coral)}
  .tighten{background:var(--peri); color:#fff; border:3px solid var(--line); border-radius:12px; padding:8px 12px; font-weight:700; display:inline-block; margin-top:6px}
  .scoreboard{display:flex; gap:10px; justify-content:center; margin:10px 0}
  .sb{border:3px solid var(--line); border-radius:14px; padding:8px 14px; font-family:'Fredoka'; font-weight:700; box-shadow:2px 2px 0 var(--line)}
  .sb.p1{background:var(--peri); color:#fff} .sb.p2{background:var(--coral); color:#fff}
  .sb b{display:block; font-size:24px; line-height:1}
  .backlink{display:inline-block; margin-top:12px; font-weight:900; cursor:pointer; border-bottom:3px solid var(--sun)}
  .hidden{display:none}
  .clue{background:var(--sun); border:3px solid var(--line); border-radius:14px; padding:12px 14px; font-weight:700; margin:6px 0 12px; display:flex; gap:8px; align-items:flex-start}
  .clue .b{font-size:20px}
  .footnote{text-align:center; font-size:12px; opacity:.55; margin-top:8px}
  .pop{animation:pop .4s ease}
  @keyframes pop{0%{transform:scale(.6); opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1); opacity:1}}
</style>

<div class="wrap">
  <header>
    <div class="logo">BALLPARK<small>guess big, guess clever</small></div>
    <div class="streak" id="streakBox"><b id="streak">0</b><span>🔥 streak</span></div>
  </header>

  <div id="home">
    <div class="card">
      <p class="lead">Daft questions nobody knows the exact answer to. The trick isn't being <i>right</i> — it's landing in the right <span class="pill">ballpark</span>.</p>
      <div class="vs">
        <span>1 player</span>
        <div class="toggle" id="vsToggle" onclick="toggleVs()"><div class="knob"></div></div>
        <span>2 players (head&#8209;to&#8209;head ⚔️)</span>
      </div>
      <div class="modes">
        <button class="mode m1" onclick="start(1)">
          <div class="emoji">📏</div><span class="age">Warm-up</span>
          <h3>Size-O-Meter</h3>
          <p>Hundreds, thousands or <b>millions</b>? Just nail the size.</p>
        </button>
        <button class="mode m2" onclick="start(2)">
          <div class="emoji">⛓️</div><span class="age">Main event</span>
          <h3>Chain Reaction</h3>
          <p>Smash a giant question into tiny guesses, then multiply (and sometimes divide).</p>
        </button>
        <button class="mode m3" onclick="start(3)">
          <div class="emoji">🎯</div><span class="age">Boss level</span>
          <h3>Calibrate</h3>
          <p>Give a range you're <b>sure</b> about. Get a clue. Tighten it. Did reality land inside?</p>
        </button>
      </div>
    </div>
    <p class="footnote">Real ballpark figures — argue with them, that's the point. Works offline. Saves nothing.</p>
  </div>

  <div id="game" class="hidden"><div class="card" id="stage"></div></div>
</div>

<script>
const $ = s => document.querySelector(s);
let streak=0, twoP=false, score=[0,0], cur=0, duel=[null,null];   // cur = current player index (0/1)
const NAMES=['Player 1','Player 2'];                      // ← rename here if you like
const rand = a => a[Math.floor(Math.random()*a.length)];
const fmt = n => Math.round(n).toLocaleString('en-GB');
function friendly(n){
  if(n>=1e15) return (n/1e15).toFixed(n/1e15>=10?0:1).replace(/\.0$/,'')+' quadrillion';
  if(n>=1e12) return (n/1e12).toFixed(n/1e12>=10?0:1).replace(/\.0$/,'')+' trillion';
  if(n>=1e9)  return (n/1e9 ).toFixed(n/1e9>=10?0:1 ).replace(/\.0$/,'')+' billion';
  if(n>=1e6)  return (n/1e6 ).toFixed(n/1e6>=10?0:1 ).replace(/\.0$/,'')+' million';
  if(n>=1e3)  return (n/1e3 ).toFixed(n/1e3>=10?0:1 ).replace(/\.0$/,'')+' thousand';
  return fmt(n);
}
function countTo(el,target,ms=1100){
  const start=performance.now();
  (function step(t){const k=Math.min(1,(t-start)/ms),e=1-Math.pow(1-k,3);
    el.textContent=fmt(target*e); if(k<1)requestAnimationFrame(step); else el.textContent=fmt(target);})(performance.now());
}
function toggleVs(){ twoP=!twoP; $('#vsToggle').classList.toggle('on',twoP); }
function setStreak(win){ if(twoP)return; streak=win?streak+1:0; $('#streak').textContent=streak; }
function home(){ cur=0; score=[0,0]; duel=[null,null]; $('#game').classList.add('hidden'); $('#home').classList.remove('hidden');
  $('#streakBox').style.visibility= twoP?'hidden':'visible'; }
function start(m){ cur=0; score=[0,0]; $('#streakBox').style.visibility=twoP?'hidden':'visible';
  $('#home').classList.add('hidden'); $('#game').classList.remove('hidden'); window._mode=m; nextRound(); }
function nextRound(){ const m=window._mode; if(m===1)modeSize(); if(m===2)modeChain(); if(m===3)modeCalib(); }
function whoTag(){ return twoP?`<div class="who p${cur+1}">${NAMES[cur]}'s turn</div>`:''; }
function scoreboard(){ return twoP?`<div class="scoreboard">
  <div class="sb p1"><b>${score[0]}</b>${NAMES[0]}</div>
  <div class="sb p2"><b>${score[1]}</b>${NAMES[1]}</div></div>`:''; }

/* =================================================== MODE 1 : SIZE-O-METER */
const sizeQs=[
  {q:"How many jelly beans would fill a bathtub?",v:30000},
  {q:"How many times does your heart beat in ONE DAY?",v:100000},
  {q:"How many hairs are on your head?",v:100000},
  {q:"How many cups of tea does the whole UK drink in a day?",v:100000000},
  {q:"How many bricks are in a normal house?",v:8000},
  {q:"How many seconds are in the six-week summer holiday?",v:3600000},
  {q:"How many grains of sugar are in a 1kg bag?",v:2000000},
  {q:"How many steps to walk the whole length of the UK?",v:1900000},
  {q:"How many seconds since the Romans left Britain (~1,600 years ago)?",v:50000000000},
  {q:"How many words are in a typical grown-up novel?",v:90000},
  {q:"How many people could stand squashed onto a football pitch?",v:28000},
  {q:"How many breaths do you take in a single day?",v:23000},
  {q:"How many heartbeats since an 11-year-old was born?",v:430000000},
];
function fourExps(tExp){
  let start=tExp-Math.floor(Math.random()*3);     // answer in 1st–3rd slot
  if(start<2)start=2; if(start+3>11)start=8;
  return [start,start+1,start+2,start+3];
}
function powLabel(e){const n=Math.pow(10,e);return friendly(n);}
function sizeTag(e){return e<=3?'(tiny)':e<=5?'(smallish)':e<=7?'(big)':e<=9?'(HUGE)':'(absurd)';}
let sizeRound=null;
function modeSize(){ cur=0; duel=[null,null];
  const it=rand(sizeQs), tExp=Math.round(Math.log10(it.v)), opts=fourExps(tExp);
  sizeRound={it,tExp,opts}; renderSize(); }
function renderSize(){
  const {it,opts}=sizeRound, cls=['c1','c2','c3','c4'];
  $('#stage').innerHTML=`${whoTag()}
    <div class="q">${it.q}</div>
    <div class="qsub">Don't work it out — just pick the right <b>size</b>.</div>
    <div class="opts">${opts.map((e,i)=>`<button class="opt ${cls[i]}" onclick="sizeGuess(${e})">
      ${powLabel(e)}<small>${sizeTag(e)}</small></button>`).join('')}</div>
    ${scoreboard()}<span class="backlink" onclick="home()">← back to games</span>`;
}
function sizeGuess(pick){
  const {it,tExp}=sizeRound, diff=Math.abs(pick-tExp), win=diff===0, close=diff===1;
  if(twoP){
    duel[cur]={pick,win,close}; if(win)score[cur]+=2; else if(close)score[cur]+=1;
    if(cur===0){ cur=1; return renderSize(); }
    return sizeDuel();
  }
  setStreak(win);
  $('#stage').innerHTML=`<div class="reveal pop">
    <div class="verdict">${win?'🎉 Right ballpark!':close?'👀 One size off!':'😅 Way off — now you know!'}</div>
    <div class="bignum ${win?'win':''}" id="bn">0</div>
    <div class="friendly">about <b>${friendly(it.v)}</b></div>
    <div class="explain"><b>Why it matters:</b> step one of any good guess is knowing whether a thing lives in the <i>hundreds</i>, the <i>thousands</i> or the <i>millions</i>. Get the size right and you're already most of the way home.</div>
    <button class="btn teal" onclick="modeSize()">Next question →</button>
    <span class="backlink" onclick="home()">← back to games</span></div>`;
  countTo($('#bn'),it.v);
}
function sizeDuel(){
  const {it,tExp}=sizeRound, d0=Math.abs(duel[0].pick-tExp), d1=Math.abs(duel[1].pick-tExp);
  const w = d0<d1?0 : d1<d0?1 : -1, mark=r=>r.win?'🎯':r.close?'👀':'❌';
  $('#stage').innerHTML=`<div class="reveal pop">
    <div class="verdict">${w===-1?"It's a tie!":NAMES[w]+' wins the round! 🏆'}</div>
    <div class="bignum" id="bn">0</div>
    <div class="friendly">about <b>${friendly(it.v)}</b></div>
    <div class="friendly" style="margin-top:8px"><b>${NAMES[0]}</b> picked ${powLabel(duel[0].pick)} ${mark(duel[0])} &nbsp;•&nbsp; <b>${NAMES[1]}</b> picked ${powLabel(duel[1].pick)} ${mark(duel[1])}</div>
    ${scoreboard()}
    <button class="btn teal" onclick="modeSize()">Next question →</button>
    <span class="backlink" onclick="home()">← back to games</span></div>`;
  countTo($('#bn'),it.v);
}

/* =================================================== MODE 2 : CHAIN REACTION */
const chainQs=[
  {q:"How many footballs would fill your classroom?",unit:"footballs",
   steps:[{t:"Footballs along the length of the room",min:5,max:60,real:36},
          {t:"Footballs along the width",min:5,max:50,real:27},
          {t:"Footballs stacked to the ceiling",min:3,max:30,real:13}]},
  {q:"How many cups of tea does your family drink in a YEAR?",unit:"cups",
   steps:[{t:"Cups one person drinks a day",min:0,max:12,real:4},
          {t:"People in your family",min:1,max:8,real:4},
          {t:"Days in a year",min:365,max:365,real:365}]},
  {q:"How long (in seconds) to count out loud to a million?",unit:"seconds",
   afterNote:"…that's roughly 23 days of non-stop counting. Don't.",
   steps:[{t:"Seconds to say one big number",min:1,max:5,real:2},
          {t:"How many numbers? (it's a million)",min:1000000,max:1000000,real:1000000}]},
  {q:"How many heartbeats in your WHOLE life?",unit:"heartbeats",
   steps:[{t:"Heartbeats a minute",min:40,max:120,real:75},
          {t:"Minutes in a day",min:1440,max:1440,real:1440},
          {t:"Days in a long life (~80 yrs)",min:25000,max:32000,real:29200}]},
  {q:"How many school buses to carry your whole town at once?",unit:"buses",
   steps:[{t:"People living in the town",min:10000,max:100000,real:50000},
          {t:"People that fit on one bus",min:30,max:70,real:50,op:'÷'}]},
  {q:"How many footsteps to school and back, all year?",unit:"steps",
   steps:[{t:"Steps one way to school",min:500,max:5000,real:2000},
          {t:"Trips a day (there & back)",min:2,max:2,real:2},
          {t:"School days in a year",min:180,max:200,real:190}]},
  {q:"How many seconds of telly will an 11-year-old have watched in their life?",unit:"seconds",
   steps:[{t:"Hours of telly a day",min:0,max:5,real:2},
          {t:"Days they've been alive (~11 yrs)",min:3500,max:4500,real:4015},
          {t:"Seconds in an hour",min:3600,max:3600,real:3600}]},
  {q:"How many piano tuners work in a big city? (the famous one!)",unit:"tuners",
   afterNote:"This is the legendary question physicist Enrico Fermi used to set his students.",
   steps:[{t:"People in the city",min:500000,max:2000000,real:1000000},
          {t:"People per piano (most people don't own one!)",min:50,max:300,real:100,op:'÷'},
          {t:"Tunings each piano needs a year",min:1,max:2,real:1},
          {t:"Pianos one tuner can do in a year",min:500,max:2000,real:1000,op:'÷'}]},
];
let chainRound=null;
function modeChain(){ cur=0; duel=[null,null]; chainRound={it:rand(chainQs), guesses:[]}; chainStep(); }
function chainStep(){
  const {it,guesses}=chainRound, i=guesses.length;
  if(i>=it.steps.length) return chainTurnDone();
  const s=it.steps[i], fixed=s.min===s.max, init=fixed?s.real:Math.round((s.min+s.max)/2);
  $('#stage').innerHTML=`${whoTag()}
    <div class="qsub">${it.q}</div>
    <div class="q">Step ${i+1} of ${it.steps.length}${s.op==='÷'?' &nbsp;➗ (this one we divide by)':''}</div>
    <div class="srow" style="margin-top:18px">
      <label>${s.t} <b id="sv">${fmt(init)}</b></label>
      <input type="range" min="${s.min}" max="${s.max}" value="${init}" ${fixed?'disabled':''}
        oninput="document.getElementById('sv').textContent=Number(this.value).toLocaleString('en-GB')" id="sl"></div>
    ${fixed?'<div class="footnote">(known fact — just nod along)</div>':''}
    <button class="btn" onclick="chainNext()">${i<it.steps.length-1?'Next →':'COMBINE IT ALL ⚡'}</button>
    <span class="backlink" onclick="home()">← back to games</span>`;
}
function combine(steps,vals){ let acc=vals[0];
  for(let i=1;i<vals.length;i++){ acc = steps[i].op==='÷' ? acc/vals[i] : acc*vals[i]; } return acc; }
function chainNext(){ chainRound.guesses.push(Number($('#sl').value)); chainStep(); }
function chainTurnDone(){
  const {it,guesses}=chainRound;
  const mine=combine(it.steps,guesses), real=combine(it.steps,it.steps.map(s=>s.real));
  const ratio=mine>real?mine/real:real/mine, win=ratio<=3, close=ratio<=10;
  const chain=guesses.map((g,i)=>(i?` <span class="x">${it.steps[i].op==='÷'?'÷':'×'}</span> `:'')+fmt(g)).join('');
  if(twoP){
    duel[cur]={mine,ratio,win,close}; score[cur]+= win?2:close?1:0;
    if(cur===0){ cur=1; chainRound.guesses=[]; return chainStep(); }
    return chainDuel(real);
  }
  setStreak(win);
  $('#stage').innerHTML=`<div class="reveal pop">
    <div class="verdict">${win?'🎉 Bang in the ballpark!':close?'👍 Close enough!':'😅 Miles off — fun though!'}</div>
    <div class="chainviz">${chain} <span class="x">=</span></div>
    <div class="bignum ${win?'win':''}" id="bn">0</div>
    <div class="friendly">your chain → <b>${friendly(mine)}</b> ${it.unit}</div>
    <div class="explain"><b>The real answer is about ${friendly(real)}.</b> ${it.afterNote||''}<br><br>
      <b>Why it matters:</b> nobody guesses a billion straight off. But anyone can guess a few small numbers — then just multiply (and sometimes divide). That's the entire trick to looking like a genius.</div>
    <button class="btn teal" onclick="modeChain()">Another →</button>
    <span class="backlink" onclick="home()">← back to games</span></div>`;
  countTo($('#bn'),mine);
}
function chainDuel(real){
  const {it}=chainRound, w = duel[0].ratio<duel[1].ratio?0 : duel[1].ratio<duel[0].ratio?1 : -1;
  const mark=r=>r.win?'🎯':r.close?'👍':'❌';
  $('#stage').innerHTML=`<div class="reveal pop">
    <div class="verdict">${w===-1?"It's a tie!":NAMES[w]+' wins the round! 🏆'}</div>
    <div class="bignum win" id="bn">0</div>
    <div class="friendly">real answer ≈ <b>${friendly(real)}</b> ${it.unit}</div>
    <div class="friendly" style="margin-top:8px"><b>${NAMES[0]}</b> got ${friendly(duel[0].mine)} ${mark(duel[0])} &nbsp;•&nbsp; <b>${NAMES[1]}</b> got ${friendly(duel[1].mine)} ${mark(duel[1])}</div>
    ${scoreboard()}
    <button class="btn teal" onclick="modeChain()">Another →</button>
    <span class="backlink" onclick="home()">← back to games</span></div>`;
  countTo($('#bn'),real);
}

/* =================================================== MODE 3 : CALIBRATE */
const calibQs=[
  {q:"How many times will your heart beat in your whole life?",v:3000000000,minE:7,maxE:11,
   clue:"A heart beats roughly 60–100 times a minute, for about 80 years."},
  {q:"How many breaths will you take in your whole life?",v:600000000,minE:6,maxE:10,
   clue:"You breathe about 12–18 times a minute, day and night, for ~80 years."},
  {q:"How many words are in all 7 Harry Potter books?",v:1084170,minE:4,maxE:8,
   clue:"7 books; a fat one runs to roughly 150,000–250,000 words."},
  {q:"How many days will you have lived if you reach 100?",v:36525,minE:3,maxE:6,
   clue:"There are 365.25 days in a year (the .25 is why we get leap years)."},
  {q:"How many LEGO bricks have ever been made?",v:900000000000,minE:9,maxE:13,
   clue:"LEGO makes tens of billions of bricks a year — and has for decades."},
  {q:"How many seconds have passed since the year 1 AD?",v:64000000000,minE:8,maxE:13,
   clue:"About 2,000 years, and roughly 31 million seconds in each year."},
  {q:"How many words will you say out loud in your whole life?",v:470000000,minE:6,maxE:10,
   clue:"People speak very roughly 15,000 words a day, for ~80 years."},
  {q:"How many times does a hummingbird flap its wings in an hour?",v:180000,minE:3,maxE:7,
   clue:"Its wings beat about 50 times every second."},
  {q:"How many ants are alive on Earth right now?",v:20000000000000000,minE:13,maxE:19,
   clue:"Scientists reckon there are well over a million ants for every single human."},
];
let calibRound=null;
const valFromS=(s,a,b)=>Math.pow(10,a+(s/1000)*(b-a));
function modeCalib(){ cur=0; duel=[null,null]; calibRound={it:rand(calibQs),firstWidth:null}; calibUI(false); }
function calibUI(withClue){
  const it=calibRound.it;
  $('#stage').innerHTML=`${whoTag()}
    <div class="q">${it.q}</div>
    <div class="qsub">Drag the handles to a range you'd be <b>quite sure</b> holds the answer. Not too wide (boring), not too narrow (risky).</div>
    ${withClue?`<div class="clue"><span class="b">💡</span><div>${it.clue} <i>Now tighten up.</i></div></div>`:''}
    <div class="band"><div class="fill" id="fill"></div></div>
    <div class="scale"><span>${friendly(Math.pow(10,it.minE))}</span><span>${friendly(Math.pow(10,it.maxE))}</span></div>
    <div class="srow lo"><label>Lowest it could be <b id="lov">–</b></label>
      <input type="range" min="0" max="1000" value="${withClue?300:250}" id="lo" oninput="calibUpdate()"></div>
    <div class="srow hi"><label>Highest it could be <b id="hiv">–</b></label>
      <input type="range" min="0" max="1000" value="${withClue?700:780}" id="hi" oninput="calibUpdate()"></div>
    <button class="btn ${withClue?'teal':'peri'}" onclick="${withClue?'calibReveal()':'calibClue()'}">
      ${withClue?'LOCK IT IN & REVEAL 🎯':'Lock range → get a clue 💡'}</button>
    <span class="backlink" onclick="home()">← back to games</span>`;
  calibUpdate();
}
function calibUpdate(){
  const it=calibRound.it; let lo=+$('#lo').value, hi=+$('#hi').value; if(lo>hi){[lo,hi]=[hi,lo];}
  $('#fill').style.left=(lo/10)+'%'; $('#fill').style.right=((1000-hi)/10)+'%';
  $('#lov').textContent=friendly(valFromS(lo,it.minE,it.maxE));
  $('#hiv').textContent=friendly(valFromS(hi,it.minE,it.maxE));
}
function curRange(){ const it=calibRound.it; let lo=+$('#lo').value,hi=+$('#hi').value; if(lo>hi){[lo,hi]=[hi,lo];}
  return [valFromS(lo,it.minE,it.maxE),valFromS(hi,it.minE,it.maxE)]; }
function calibClue(){ const [lo,hi]=curRange(); calibRound.firstWidth=hi/lo; calibUI(true); }
function calibReveal(){
  const it=calibRound.it, [lo,hi]=curRange(), inside=it.v>=lo&&it.v<=hi, width=hi/lo, tighter=calibRound.firstWidth/width;
  if(twoP){
    duel[cur]={lo,hi,inside,width}; if(inside) score[cur]+= width<10?3:width<100?2:1;
    if(cur===0){ cur=1; calibRound.firstWidth=null; return calibUI(false); }
    return calibDuel();
  }
  setStreak(inside);
  $('#stage').innerHTML=`<div class="reveal pop">
    <div class="verdict">${inside?'🎯 Reality landed in your range!':'😬 Reality slipped outside'}</div>
    <div class="bignum ${inside?'win':''}" id="bn">0</div>
    <div class="friendly">real answer ≈ <b>${friendly(it.v)}</b></div>
    <div class="friendly" style="margin-top:8px">your final range: ${friendly(lo)} → ${friendly(hi)}</div>
    ${tighter>1.3?`<div><span class="tighten">You tightened your range ${tighter.toFixed(1)}× after the clue 👏</span></div>`:''}
    <div class="explain"><b>Why it matters:</b> good thinking isn't one perfect number — it's an honest <i>range</i> that you <i>shrink</i> when new evidence shows up. That clue was new evidence. The aim: be right <i>most</i> of the time with ranges that are still nice and tight. ${inside?'You were honest AND sharp.':'Widen a touch next time — or you just got unlucky. Both allowed.'}</div>
    <button class="btn peri" onclick="modeCalib()">Another →</button>
    <span class="backlink" onclick="home()">← back to games</span></div>`;
  countTo($('#bn'),it.v);
}
function calibDuel(){
  const it=calibRound.it, a=duel[0], b=duel[1];
  let w=-1;
  if(a.inside&&b.inside) w = a.width<b.width?0 : b.width<a.width?1 : -1;
  else if(a.inside) w=0; else if(b.inside) w=1;
  const tag=r=>r.inside?'🎯 landed it':'❌ missed';
  $('#stage').innerHTML=`<div class="reveal pop">
    <div class="verdict">${w===-1?(a.inside||b.inside?"It's a tie!":'Nobody landed it! 😬'):NAMES[w]+' wins the round! 🏆'}</div>
    <div class="bignum win" id="bn">0</div>
    <div class="friendly">real answer ≈ <b>${friendly(it.v)}</b></div>
    <div class="friendly" style="margin-top:8px"><b>${NAMES[0]}</b>: ${friendly(a.lo)} → ${friendly(a.hi)} ${tag(a)}<br><b>${NAMES[1]}</b>: ${friendly(b.lo)} → ${friendly(b.hi)} ${tag(b)}</div>
    <div class="explain">Tightest <i>correct</i> range wins — being right matters, but so does daring to go narrow. That's calibration in a nutshell.</div>
    ${scoreboard()}
    <button class="btn peri" onclick="modeCalib()">Another →</button>
    <span class="backlink" onclick="home()">← back to games</span></div>`;
  countTo($('#bn'),it.v);
}
</script>
